name: Beta feedback or problem report
description: Tell us what went wrong or what felt off in a LemmeType beta. Please do not include recordings or dictated text.
title: "[Beta] "
labels: ["beta-feedback"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for testing LemmeType.

        **Privacy first:** please do **not** attach audio recordings, paste dictated text, or share screenshots that show private text. Describe what happened in your own words instead. If you attach a diagnostics report, save it from Settings › Diagnostics and read the preview first: it has no audio, text, or app names.
  - type: input
    id: version
    attributes:
      label: LemmeType version
      description: Settings › General › Updates shows it. Report a Problem fills this in for you.
    validations:
      required: true
  - type: input
    id: build
    attributes:
      label: Build number
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
    validations:
      required: true
  - type: input
    id: mac
    attributes:
      label: Mac model
      description: For example Mac16,1
  - type: dropdown
    id: severity
    attributes:
      label: How bad is it?
      options:
        - Blocker — I cannot dictate at all, or data was lost
        - Major — a main feature fails
        - Minor — something is wrong but there is a way around it
        - Idea or question
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, and what did LemmeType do? Name the kind of app you were typing into if it matters.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
  - type: textarea
    id: steps
    attributes:
      label: Steps to repeat it
  - type: checkboxes
    id: privacy
    attributes:
      label: Before you send
      options:
        - label: I did not include audio, dictated text, or private screenshots.
          required: true
